<svg
    xmlns="http://www.w3.org/2000/svg"
    width="900"
    height="520"
    viewBox="0 0 900 520"
    role="img"
    aria-label="GitHub Activity Overview for 2026"
>

    <defs>

        <!-- =================================================
             BACKGROUND
        ================================================== -->

        <linearGradient
            id="background"
            x1="0%"
            y1="0%"
            x2="100%"
            y2="100%"
        >
            <stop
                offset="0%"
                stop-color="#071a14"
            />

            <stop
                offset="50%"
                stop-color="#0b241b"
            />

            <stop
                offset="100%"
                stop-color="#06140f"
            />
        </linearGradient>


        <!-- =================================================
             ACTIVITY FILL
        ================================================== -->

        <linearGradient
            id="activityGradient"
            x1="0%"
            y1="0%"
            x2="100%"
            y2="100%"
        >
            <stop
                offset="0%"
                stop-color="#35d399"
                stop-opacity="0.30"
            />

            <stop
                offset="100%"
                stop-color="#159570"
                stop-opacity="0.10"
            />
        </linearGradient>


        <!-- =================================================
             GLOW
        ================================================== -->

        <filter
            id="glow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%"
        >

            <feGaussianBlur
                stdDeviation="4"
                result="blur"
            />

            <feMerge>

                <feMergeNode
                    in="blur"
                />

                <feMergeNode
                    in="SourceGraphic"
                />

            </feMerge>

        </filter>


        <!-- =================================================
             SHADOW
        ================================================== -->

        <filter
            id="shadow"
            x="-20%"
            y="-20%"
            width="140%"
            height="140%"
        >

            <feDropShadow
                dx="0"
                dy="8"
                stdDeviation="12"
                flood-color="#000000"
                flood-opacity="0.30"
            />

        </filter>

    </defs>


    <!-- =====================================================
         OUTER BACKGROUND
    ====================================================== -->

    <rect
        x="0"
        y="0"
        width="900"
        height="520"
        rx="22"
        fill="url(#background)"
    />


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <text
        x="45"
        y="48"
        font-family="Arial, Helvetica, sans-serif"
        font-size="23"
        font-weight="700"
        fill="#f1fdf8"
    >
        Activity overview
    </text>


    <text
        x="45"
        y="72"
