<svg
    xmlns="http://www.w3.org/2000/svg"
    width="900"
    height="520"
    viewBox="0 0 900 520"
    role="img"
    aria-label="GitHub Activity Radar"
>

    <defs>

        <!-- Background -->
        <linearGradient
            id="background"
            x1="0%"
            y1="0%"
            x2="100%"
            y2="100%"
        >
            <stop
                offset="0%"
                stop-color="#071a14"
            />

            <stop
                offset="50%"
                stop-color="#0b241b"
            />

            <stop
                offset="100%"
                stop-color="#06140f"
            />
        </linearGradient>


        <!-- Activity gradient -->
        <linearGradient
            id="activityGradient"
            x1="0%"
            y1="0%"
            x2="100%"
            y2="100%"
        >
            <stop
                offset="0%"
                stop-color="#35d399"
                stop-opacity="0.78"
            />

            <stop
                offset="100%"
                stop-color="#159570"
                stop-opacity="0.42"
            />
        </linearGradient>


        <!-- Glow -->
        <filter
            id="glow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%"
        >
            <feGaussianBlur
                stdDeviation="5"
                result="blur"
            />

            <feMerge>
                <feMergeNode
                    in="blur"
                />

                <feMergeNode
                    in="SourceGraphic"
                />
            </feMerge>
        </filter>


        <!-- Soft shadow -->
        <filter
            id="shadow"
            x="-20%"
            y="-20%"
            width="140%"
            height="140%"
        >
            <feDropShadow
                dx="0"
                dy="8"
                stdDeviation="12"
                flood-color="#000000"
                flood-opacity="0.35"
            />
        </filter>

    </defs>


    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <rect
        x="0"
        y="0"
        width="900"
        height="520"
        rx="22"
        fill="url(#background)"
    />


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <text
        x="450"
        y="48"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="24"
        font-weight="700"
        fill="#f1fdf8"
        letter-spacing="0.5"
    >
        GitHub Activity
    </text>

    <text
        x="450"
        y="73"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12"
        fill="#8faea2"
        letter-spacing="1"
    >
        Nasrullah8586 · LAST 12 MONTHS
    </text>


    <!-- =====================================================
         MAIN CARD
    ====================================================== -->

    <rect
        x="70"
        y="100"
        width="760"
        height="340"
        rx="20"
        fill="#081b15"
        fill-opacity="0.72"
        stroke="#17382d"
        stroke-width="1"
        filter="url(#shadow)"
    />


    <!-- =====================================================
         RADAR CENTER
    ====================================================== -->

    <!-- Outer radar -->
    <circle
        cx="450"
        cy="270"
        r="155"
        fill="none"
        stroke="#21493b"
        stroke-width="1"
    />

    <!-- Level 75 -->
    <circle
        cx="450"
        cy="270"
        r="116"
        fill="none"
        stroke="#1b3d32"
        stroke-width="1"
    />

    <!-- Level 50 -->
    <circle
        cx="450"
        cy="270"
        r="77"
        fill="none"
        stroke="#18382e"
        stroke-width="1"
    />

    <!-- Level 25 -->
    <circle
        cx="450"
        cy="270"
        r="39"
        fill="none"
        stroke="#153229"
        stroke-width="1"
    />


    <!-- =====================================================
         AXES
    ====================================================== -->

    <!-- Commits axis -->
    <line
        x1="450"
        y1="270"
        x2="450"
        y2="115"
        stroke="#285344"
        stroke-width="1"
    />

    <!-- Pull Requests axis -->
    <line
        x1="450"
        y1="270"
        x2="605"
        y2="270"
        stroke="#285344"
        stroke-width="1"
    />

    <!-- Issues axis -->
    <line
        x1="450"
        y1="270"
        x2="450"
        y2="425"
        stroke="#285344"
        stroke-width="1"
    />

    <!-- Reviews axis -->
    <line
        x1="450"
        y1="270"
        x2="295"
        y2="270"
        stroke="#285344"
        stroke-width="1"
    />


    <!-- =====================================================
         RADAR ACTIVITY
    ====================================================== -->

    <polygon
        points="450.00,100.00 451.01,255.00 450.00,255.00 450.00,255.00"
        fill="url(#activityGradient)"
        fill-opacity="0.42"
        stroke="#35d399"
        stroke-width="2"
        stroke-linejoin="round"
        filter="url(#glow)"
    />


    <!-- =====================================================
         ACTIVITY POINTS
    ====================================================== -->

    <circle
        cx="450.00"
        cy="100.00"
        r="5"
        fill="#35d399"
        stroke="#d9fff0"
        stroke-width="2"
    />

    <circle
        cx="451.01"
        cy="255.00"
        r="5"
        fill="#35d399"
        stroke="#d9fff0"
        stroke-width="2"
    />

    <circle
        cx="450.00"
        cy="255.00"
        r="5"
        fill="#35d399"
        stroke="#d9fff0"
        stroke-width="2"
    />

    <circle
        cx="450.00"
        cy="255.00"
        r="5"
        fill="#35d399"
        stroke="#d9fff0"
        stroke-width="2"
    />


    <!-- =====================================================
         AXIS LABELS
    ====================================================== -->

    <!-- Commits -->
    <text
        x="450"
        y="118"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        font-weight="700"
        fill="#d9fff0"
    >
        Commits
    </text>

    <text
        x="450"
        y="136"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11"
        fill="#7fa99a"
    >
        154 · 100%
    </text>


    <!-- Pull Requests -->
    <text
        x="625"
        y="265"
        text-anchor="start"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        font-weight="700"
        fill="#d9fff0"
    >
        Pull Requests
    </text>

    <text
        x="625"
        y="283"
        text-anchor="start"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11"
        fill="#7fa99a"
    >
        1 · 1%
    </text>


    <!-- Issues -->
    <text
        x="450"
        y="421"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        font-weight="700"
        fill="#d9fff0"
    >
        Issues
    </text>

    <text
        x="450"
        y="402"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11"
        fill="#7fa99a"
    >
        0 · 0%
    </text>


    <!-- Code Reviews -->
    <text
        x="275"
        y="265"
        text-anchor="end"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        font-weight="700"
        fill="#d9fff0"
    >
        Code Reviews
    </text>

    <text
        x="275"
        y="283"
        text-anchor="end"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11"
        fill="#7fa99a"
    >
        0 · 0%
    </text>


    <!-- =====================================================
         CENTER
    ====================================================== -->

    <circle
        cx="450"
        cy="270"
        r="4"
        fill="#d9fff0"
    />


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <text
        x="450"
        y="475"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11"
        fill="#66877b"
        letter-spacing="0.4"
    >
        Contribution activity · Updated automatically
    </text>

    <text
        x="450"
        y="494"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="10"
        fill="#49675d"
    >
        Sep 18, 2026
    </text>

</svg>
