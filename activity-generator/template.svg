<line x1="0" y1="0" x2="128" y2="-42" stroke="#2D9C7C"/>
<line x1="0" y1="0" x2="79" y2="109" stroke="#2D9C7C"/>
<line x1="0" y1="0" x2="-79" y2="109" stroke="#2D9C7C"/>
<line x1="0" y1="0" x2="-128" y2="-42" stroke="#2D9C7C"/>

<!-- Activity polygon -->
<polygon
  points="{{commitsPoint}} {{pullRequestsPoint}} {{issuesPoint}} {{reviewsPoint}} {{codePoint}}"
  fill="#2D9C7C"
  fill-opacity="0.25"
  stroke="#35C493"
  stroke-width="3"
  filter="url(#glow)"
/>

<!-- Activity points -->
<circle cx="{{commitsX}}" cy="{{commitsY}}" r="5" fill="#35C493"/>
<circle cx="{{pullRequestsX}}" cy="{{pullRequestsY}}" r="5" fill="#35C493"/>
<circle cx="{{issuesX}}" cy="{{issuesY}}" r="5" fill="#35C493"/>
<circle cx="{{reviewsX}}" cy="{{reviewsY}}" r="5" fill="#35C493"/>
<circle cx="{{codeX}}" cy="{{codeY}}" r="5" fill="#35C493"/>
