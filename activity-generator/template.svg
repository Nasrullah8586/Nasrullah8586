       RADAR CHART
  =============================== -->

  <g transform="translate(450 245)">

```
<!-- Outer Radar -->
<polygon
  points="0,-145 145,0 0,145 -145,0"
  fill="none"
  stroke="#245f49"
  stroke-width="1"
/>

<!-- Middle Radar -->
<polygon
  points="0,-105 105,0 0,105 -105,0"
  fill="none"
  stroke="#245f49"
  stroke-width="1"
/>

<!-- Inner Radar -->
<polygon
  points="0,-65 65,0 0,65 -65,0"
  fill="none"
  stroke="#245f49"
  stroke-width="1"
/>


<!-- Axis: Commits -->
<line
  x1="0"
  y1="0"
  x2="0"
  y2="-145"
  stroke="#2D9C7C"
  stroke-width="1.5"
/>

<!-- Axis: Pull Requests -->
<line
  x1="0"
  y1="0"
  x2="145"
  y2="0"
  stroke="#2D9C7C"
  stroke-width="1.5"
/>

<!-- Axis: Issues -->
<line
  x1="0"
  y1="0"
  x2="0"
  y2="145"
  stroke="#2D9C7C"
  stroke-width="1.5"
/>

<!-- Axis: Code Reviews -->
<line
  x1="0"
  y1="0"
  x2="-145"
  y2="0"
  stroke="#2D9C7C"
  stroke-width="1.5"
/>


<!-- ==============================
     DYNAMIC RADAR AREA
=============================== -->

<polygon
  points="
    0,{{commitsRadius}}
    {{pullRequestsRadius}},0
    0,{{issuesRadius}}
    -{{reviewsRadius}},0
  "
  fill="#2D9C7C"
  fill-opacity="0.28"
  stroke="#35C493"
  stroke-width="3"
  filter="url(#glow)"
/>


<!-- Dynamic Points -->

<circle
  cx="0"
  cy="{{commitsRadius}}"
  r="5"
  fill="#35C493"
/>

<circle
  cx="{{pullRequestsRadius}}"
  cy="0"
  r="5"
  fill="#35C493"
/>

<circle
  cx="0"
  cy="{{issuesRadius}}"
  r="5"
  fill="#35C493"
/>

<circle
  cx="-{{reviewsRadius}}"
  cy="0"
  r="5"
  fill="#35C493"
/>
