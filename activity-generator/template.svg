<svg width="900" height="460" viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071a14"/>
      <stop offset="100%" stop-color="#0d2b20"/>
    </linearGradient>

```
<filter id="glow">
  <feGaussianBlur stdDeviation="3" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>
```

  </defs>

  <!-- Background -->

<rect
 width="900"
 height="460"
 rx="22"
 fill="url(#background)"
/>

  <!-- Border -->

<rect
 x="1"
 y="1"
 width="898"
 height="458"
 rx="22"
 fill="none"
 stroke="#176B45"
 stroke-width="2"
/>

